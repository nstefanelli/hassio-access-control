name: Bug report
description: Something's broken — file a report so it can be fixed.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **For security issues, please don't use this form.** See
        [SECURITY.md](https://github.com/nstefanelli/hassio-access-control/blob/main/SECURITY.md)
        for the private reporting channel instead.

  - type: input
    id: app-version
    attributes:
      label: Access Control version
      description: Found on the app page in Home Assistant, or in `access_control/config.yaml`.
      placeholder: "Exact version, for example 1.5.2"
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: UniFi topology
      options:
        - One console for Access and Protect
        - Separate Access and Protect consoles
        - Access only / no Protect
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: affected-path
    attributes:
      label: Affected path
      options:
        - Authorization / credential event
        - HA-external lock / re-lock
        - UniFi-native door
        - Hub sync
        - Alarm / lockdown
        - Visitor
        - Dashboard / Ingress / login
        - REST API
        - Install / startup / update / backup
        - Other
    validations:
      required: true

  - type: input
    id: timezone
    attributes:
      label: Site timezone and event time
      description: Required for schedules/visitors; include local time and UTC offset when known.
      placeholder: "Europe/Berlin; 2026-07-12 22:15 CEST (UTC+02:00)"
    validations:
      required: false

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant version
      description: Settings → About in HA.
      placeholder: "2026.5.1"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - HAOS (Home Assistant Operating System)
        - HA Supervised on Debian
        - Other (please describe below)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
      placeholder: |
        1. Clicked "Buzz" on the Front Door card
        2. Expected lock to relock after 30s
        3. Lock stayed unlocked
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: |
        Paste the smallest relevant section from the app Log tab and the
        sanitized Activity reason. If available, include /api/health or
        /api/debug output with identifiers removed. Never attach a database,
        WAL, Supervisor backup, API key, token, password, PIN, cookie, or
        ACCESS_CONTROL_SECRET_KEY. Redact hosts, entity IDs, and household data.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Safety and troubleshooting checks
      options:
        - label: I reviewed the current Operations troubleshooting guide.
          required: true
        - label: I removed credentials, PINs, cookies, database/backup files, and household-sensitive data.
          required: true
        - label: This is not an undisclosed security vulnerability (those use Private Vulnerability Reporting).
          required: true
