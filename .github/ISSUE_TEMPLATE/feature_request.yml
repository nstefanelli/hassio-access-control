name: Feature request
description: Suggest a new capability or improvement.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: Describe the capability you're imagining.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: |
        What problem does this solve, or what does it unlock for you?
        Concrete scenarios help a lot.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: |
        Any workarounds, related HA integrations, or other approaches you
        looked at — and why they didn't fit.
    validations:
      required: false

  - type: textarea
    id: safety
    attributes:
      label: Physical-access and failure behavior
      description: |
        If this can lock/unlock a door, change alarm behavior, or grant access,
        describe the safe result when HA, UniFi, the network, or input data is
        unavailable. Note any migration or rollback impact.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Primary area
      options:
        - Authorization policy
        - Locks / re-locks / hub sync
        - Alarms / lockdown
        - Visitors / schedules
        - Dashboard / API
        - Reliability / performance
        - Packaging / operations / documentation
        - Other
    validations:
      required: true
