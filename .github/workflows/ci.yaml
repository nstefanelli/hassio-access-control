name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on slug to build"
        required: true
        default: "access_control"
        type: choice
        options:
          - access_control

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  # Keep main builds ordered: cancelling a version-bump build after one
  # architecture has pushed would leave a partial release. PRs remain cheap
  # to supersede when a contributor pushes a newer revision.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---- Lint stage (fast, fails the workflow before we burn build minutes) ----

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: frenck/action-yamllint@34b4bbcaeabedcfefad6adea8c5bbc42af0e2d47 # v1.5.0

  hadolint:
    name: hadolint (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [access_control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: ${{ matrix.addon }}/Dockerfile

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: "-e SC1008 -s bash"
        with:
          ignore_paths: >-
            **/tests
            **/templates
            **/static
      - name: Test release workflow helpers
        run: |
          set -euo pipefail
          bash .github/scripts/release-utils.sh self-test
          notes=$(mktemp)
          trap 'rm -f "${notes}"' EXIT
          version=$(yq -r '.version' access_control/config.yaml)
          bash .github/scripts/release-utils.sh extract-notes \
            "${version}" access_control/CHANGELOG.md "${notes}"

  frontend:
    name: frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rebuild pinned Tailwind bundle
        working-directory: access_control/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run build
          git diff --exit-code -- ../rootfs/opt/access_control/static/app.css

  pytest:
    name: pytest (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: [access_control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.addon }}/rootfs/opt/access_control/requirements-dev.txt
      - name: Install dependencies
        working-directory: ${{ matrix.addon }}/rootfs/opt/access_control
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ${{ matrix.addon }}/rootfs/opt
        run: pytest access_control/tests -q

  bandit:
    name: bandit (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [access_control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run bandit (fail on Medium+ / Medium+)
        # `--severity-level medium` filters out LOW-severity findings.
        # `--confidence-level medium` filters out LOW-confidence findings.
        # The build fails if any Medium+ severity AND Medium+ confidence
        # finding remains. Known false positives in database.py carry
        # inline `# nosec B608` suppressions with documented rationale.
        run: bandit -r ${{ matrix.addon }}/rootfs/opt/access_control -x ${{ matrix.addon }}/rootfs/opt/access_control/tests --severity-level medium --confidence-level medium

  pip-audit:
    name: pip-audit (${{ matrix.addon }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [access_control]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit runtime dependencies
        run: pip-audit -r ${{ matrix.addon }}/rootfs/opt/access_control/requirements.txt --strict
      - name: Audit dev dependencies
        run: pip-audit -r ${{ matrix.addon }}/rootfs/opt/access_control/requirements-dev.txt --strict

  # ---- Build stage: detect changed addons, build per arch ----

  init:
    name: Detect changed apps
    runs-on: ubuntu-latest
    needs: [yamllint, hadolint, shellcheck, frontend, pytest, bandit, pip-audit]
    outputs:
      changed_addons: ${{ steps.detect.outputs.addons }}
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed apps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ADDON: ${{ github.event.inputs.addon }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ALL_ADDONS=()
          for dir in */; do
            [ -f "${dir%/}/config.yaml" ] && ALL_ADDONS+=("\"${dir%/}\"")
          done
          ALL_JSON="[$(IFS=,; echo "${ALL_ADDONS[*]}")]"

          emit_all() {
            echo "addons=${ALL_JSON}" >> "${GITHUB_OUTPUT}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          }

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "addons=[\"${INPUT_ADDON}\"]" >> "${GITHUB_OUTPUT}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            FROM="${BASE_SHA}"
            TO="${HEAD_SHA}"
          else
            FROM="${BEFORE_SHA}"
            TO="${AFTER_SHA}"
          fi
          if [ -z "${FROM}" ] || [ "${FROM}" = "0000000000000000000000000000000000000000" ]; then
            FROM="$(git rev-list --max-parents=0 HEAD)"
          fi

          DIFF=$(git diff --name-only "${FROM}" "${TO}")
          # If the workflow itself, repository.yaml, or any shared config
          # changed, force a build of all addons. Narrow detection is only
          # safe when the diff is unambiguously scoped to one addon's dir.
          if echo "${DIFF}" | grep -qE "^(\.github/(workflows|scripts)/|repository\.yaml$|\.dockerignore$|LICENSE$)"; then
            echo "Workflow / shared file changed — building all addons"
            emit_all
            exit 0
          fi

          CHANGED=()
          while IFS= read -r dir; do
            [ -z "${dir}" ] && continue
            [ -f "${dir}/config.yaml" ] && CHANGED+=("\"${dir}\"")
          done < <(echo "${DIFF}" | awk -F/ 'NF>1 {print $1}' | sort -u)

          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "addons=[]" >> "${GITHUB_OUTPUT}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "addons=[$(IFS=,; echo "${CHANGED[*]}")]" >> "${GITHUB_OUTPUT}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: init
    if: needs.init.outputs.changed == 'true'
    # aarch64 builds natively on GitHub's arm64 runners. This is not just a
    # speed win: the composable build-image action does NOT set up QEMU, so
    # cross-building aarch64 on an amd64 runner would fail outright.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
        arch:
          - amd64
          - aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tag selection compares the current manifest with the pre-push
          # commit and checks existing release tags.
          fetch-depth: 0

      - name: Read app metadata
        id: meta
        env:
          ADDON: ${{ matrix.addon }}
          BEFORE_SHA: ${{ github.event.before }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION=$(yq -r '.version' "${ADDON}/config.yaml")
          SLUG=$(yq -r '.slug' "${ADDON}/config.yaml")
          NAME=$(yq -r '.name' "${ADDON}/config.yaml")
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid semantic version in ${ADDON}/config.yaml: '${VERSION}'"
            exit 1
          fi

          # A push to main is a release build only when the add-on's manifest
          # version changed across the complete push. Everything else,
          # including workflow_dispatch, gets an immutable commit tag.
          PREVIOUS_VERSION="${VERSION}"
          if [[ "${EVENT_NAME}" == "push" && "${GIT_REF}" == "refs/heads/main" ]]; then
            if [[ -z "${BEFORE_SHA}" || "${BEFORE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              PREVIOUS_VERSION="__missing__"
            elif git cat-file -e "${BEFORE_SHA}:${ADDON}/config.yaml" 2>/dev/null; then
              PREVIOUS_VERSION=$(git show "${BEFORE_SHA}:${ADDON}/config.yaml" | yq -r '.version' -)
            else
              # A newly-added add-on has no prior manifest and is therefore
              # eligible for its initial version publication.
              PREVIOUS_VERSION="__missing__"
            fi
          fi

          IMAGE_TAGS=$(bash .github/scripts/release-utils.sh select-image-tags \
            "${EVENT_NAME}" "${GIT_REF}" "${VERSION}" \
            "${PREVIOUS_VERSION}" "${COMMIT_SHA}")
          if grep -qx 'latest' <<< "${IMAGE_TAGS}"; then
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
              TAG_SHA=$(git rev-list -n 1 "refs/tags/v${VERSION}")
              if [ "${TAG_SHA}" != "${COMMIT_SHA}" ]; then
                echo "::error::Refusing version reuse: v${VERSION} points to ${TAG_SHA}, not ${COMMIT_SHA}"
                exit 1
              fi
              # A rerun of an already-tagged release is a snapshot build. It
              # must not rewrite the immutable version/latest images.
              IMAGE_TAGS=$(bash .github/scripts/release-utils.sh select-image-tags \
                workflow_dispatch "${GIT_REF}" "${VERSION}" \
                "${VERSION}" "${COMMIT_SHA}")
              echo "Existing release tag v${VERSION} matches this commit; using snapshot tag ${IMAGE_TAGS}"
            else
              echo "Release image tags selected for ${ADDON}: ${VERSION}, latest"
            fi
          else
            echo "Snapshot image tag selected for ${ADDON}: ${IMAGE_TAGS}"
          fi

          # Folded scalars are single-line, but flatten defensively: a
          # newline here would corrupt the GITHUB_OUTPUT / build-args
          # line-oriented formats.
          DESCRIPTION=$(yq -r '.description' "${ADDON}/config.yaml" | tr '\n' ' ')
          # Derive the image name / registry prefix from config.yaml's
          # `image:` field so the published image name is always the one
          # Supervisor will pull. Splitting registry/owner from repo name
          # avoids the double-prefix trap where a registry host + a fully
          # qualified image produces `ghcr.io/ghcr.io/...`.
          IMAGE_FULL=$(yq -r '.image' "${ADDON}/config.yaml")

          # Fail loud on parser garbage. yq returns literal "null" for a
          # missing key; parameter expansion silently produces empty
          # strings for empty input; a bare image name (no slash) would
          # collapse the registry prefix into the repo name. The original
          # 1.2.0 publish-failure bug class returns the moment this guard
          # is removed.
          if [[ -z "${IMAGE_FULL}" || "${IMAGE_FULL}" == "null" || "${IMAGE_FULL}" != */* ]]; then
            echo "::error::config.yaml '.image' must be a registry-qualified path like ghcr.io/owner/repo-{arch} (got: '${IMAGE_FULL}')"
            exit 1
          fi

          IMAGE_NAME="${IMAGE_FULL##*/}"
          DOCKER_HUB="${IMAGE_FULL%/*}"

          # Unlike the legacy builder, build-image does NOT substitute the
          # {arch} placeholder — do it here, and fail loud if any brace
          # survives, because Supervisor pulls <name>-<arch> literally and
          # a name skew bricks the install.
          IMAGE_NAME="${IMAGE_NAME//\{arch\}/${{ matrix.arch }}}"
          if [[ "${IMAGE_NAME}" == *[{}]* ]]; then
            echo "::error::unsubstituted placeholder in image name: ${IMAGE_NAME}"
            exit 1
          fi

          # Defence against the specific regression we hit in 1.2.0: the
          # IMAGE_NAME shouldn't itself contain a registry host or we'll
          # re-introduce the doubled `ghcr.io/ghcr.io/...` push target.
          if [[ "${DOCKER_HUB}/${IMAGE_NAME}" == *ghcr.io/ghcr.io/* ]]; then
            echo "::error::doubled ghcr.io prefix in computed image path: ${DOCKER_HUB}/${IMAGE_NAME}"
            exit 1
          fi

          PUSH_IMAGE=false
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            PUSH_IMAGE=true
            if ! grep -qx 'latest' <<< "${IMAGE_TAGS}"; then
              # sha-* tags are immutable. A workflow rerun still rebuilds and
              # validates the image, but it must not replace a snapshot that
              # was already published for this architecture.
              image_ref="${DOCKER_HUB}/${IMAGE_NAME}:${IMAGE_TAGS}"
              inspect_error=$(mktemp)
              trap 'rm -f "${inspect_error}"' EXIT
              echo "${GH_TOKEN}" | docker login ghcr.io \
                --username "${GITHUB_ACTOR}" --password-stdin >/dev/null
              if docker manifest inspect "${image_ref}" >/dev/null 2>"${inspect_error}"; then
                PUSH_IMAGE=false
                echo "Immutable snapshot ${image_ref} already exists; rebuild will not push."
              elif grep -Eqi 'manifest unknown|no such manifest|not found' "${inspect_error}"; then
                echo "Snapshot ${image_ref} does not exist yet; it will be published."
              else
                echo "::error::Could not determine whether ${image_ref} already exists"
                sed 's/^/registry: /' "${inspect_error}" >&2
                exit 1
              fi
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "slug=${SLUG}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION}"
            echo "image_name=${IMAGE_NAME}"
            echo "docker_hub=${DOCKER_HUB}"
            echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "push_image=${PUSH_IMAGE}"
            echo "image_tags<<EOF"
            echo "${IMAGE_TAGS}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # build-image logs into the registry itself when push=true, so no
      # separate docker/login-action step is needed. BUILD_ARCH and
      # BUILD_VERSION build-args plus the io.hass.arch / io.hass.version /
      # org.opencontainers.image.{created,source,version} labels are
      # injected by the action; the remaining BUILD_* args below populate
      # the Dockerfile's LABEL block (io.hass.name, OCI title/description/
      # revision/licenses). PRs build both arches but never push.
      - name: Build image (release or immutable snapshot)
        uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ steps.meta.outputs.docker_hub }}/${{ steps.meta.outputs.image_name }}
          image-tags: ${{ steps.meta.outputs.image_tags }}
          version: ${{ steps.meta.outputs.version }}
          context: ${{ matrix.addon }}
          file: ${{ matrix.addon }}/Dockerfile
          build-args: |
            BUILD_NAME=${{ steps.meta.outputs.name }}
            BUILD_DESCRIPTION=${{ steps.meta.outputs.description }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-gha-scope: ${{ matrix.addon }}
          container-registry: ghcr.io
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.push_image == 'true' }}
          cosign: false

  # ---- Aggregation gate: enforces that every matrix leg succeeded ----

  build-complete:
    name: Build complete
    runs-on: ubuntu-latest
    needs: [init, build]
    if: always()
    steps:
      - name: Verify all builds succeeded
        env:
          INIT_RESULT: ${{ needs.init.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHANGED: ${{ needs.init.outputs.changed }}
        run: |
          set -euo pipefail
          # Skip is acceptable only when init declared no addons changed.
          if [ "${INIT_RESULT}" != "success" ]; then
            echo "init job did not succeed: ${INIT_RESULT}" >&2
            exit 1
          fi
          if [ "${CHANGED}" != "true" ]; then
            echo "No addons changed; nothing to verify."
            exit 0
          fi
          if [ "${BUILD_RESULT}" != "success" ]; then
            echo "build job result: ${BUILD_RESULT}" >&2
            exit 1
          fi
          echo "All matrix builds succeeded."
