name: Builder

on:
  push:
    branches:
      - main
    paths:
      - "access_control/**"
      - ".github/workflows/builder.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "access_control/**"
      - ".github/workflows/builder.yaml"
  workflow_dispatch:
    inputs:
      addon:
        description: "Add-on slug to build"
        required: true
        default: "access_control"
        type: choice
        options:
          - access_control

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed add-ons
        id: changed_addons
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ADDONS='["${{ github.event.inputs.addon }}"]'
            echo "addons=${ADDONS}" >> "${GITHUB_OUTPUT}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          # Detect which addon directories changed in this push/PR.
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi
          CHANGED_DIRS=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" \
            | awk -F/ '/^[a-z0-9_]+\/config\.yaml$|^[a-z0-9_]+\// {print $1}' \
            | sort -u)
          ADDONS=()
          for dir in ${CHANGED_DIRS}; do
            if [[ -f "${dir}/config.yaml" ]]; then
              ADDONS+=("\"${dir}\"")
            fi
          done
          if [[ ${#ADDONS[@]} -eq 0 ]]; then
            echo "addons=[]" >> "${GITHUB_OUTPUT}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            JSON="[$(IFS=,; echo "${ADDONS[*]}")]"
            echo "addons=${JSON}" >> "${GITHUB_OUTPUT}"
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build ${{ matrix.addon }} (${{ matrix.arch }})
    needs: init
    if: needs.init.outputs.changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon: ${{ fromJSON(needs.init.outputs.changed_addons) }}
        arch:
          - amd64
          - aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on metadata
        id: meta
        run: |
          VERSION=$(yq '.version' "${{ matrix.addon }}/config.yaml")
          SLUG=$(yq '.slug' "${{ matrix.addon }}/config.yaml")
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "slug=${SLUG}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build add-on
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "ghcr.io/${{ github.repository_owner }}/hassio-${{ steps.meta.outputs.slug }}-{arch}" \
            --docker-hub-check \
            --version "${{ steps.meta.outputs.version }}" \
            ${{ github.event_name != 'pull_request' && '--docker-hub ghcr.io --addon' || '--addon --test' }}
