version: 2

updates:
  # ----- GitHub Actions -----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"

  # ----- Docker base image (build-args BUILD_FROM) -----
  - package-ecosystem: docker
    directory: /access_control
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    # Dependabot will track the ARG BUILD_FROM default; the actual
    # multi-arch values are in build.yaml — those need to be bumped
    # by hand alongside any Dependabot PR.

  # ----- Python runtime dependencies -----
  - package-ecosystem: pip
    directory: /access_control/rootfs/opt/access_control
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    # Group patch + minor bumps to reduce PR noise; major bumps stay
    # separate so they get individual review.
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    # Security advisories always open a PR regardless of the schedule.
    ignore:
      # fastapi 0.136.3 ships an undocumented `fastar` dependency in its
      # [standard] extras (OSV MAL-2026-4750, published 2026-05-23). We
      # don't use the [standard] extras, so the typosquat never resolved
      # for us — but pip-audit blocks any install of 0.136.3 and there's
      # no fix version yet. Block the bot from re-bumping until upstream
      # ships a clean successor; remove this entry then.
      - dependency-name: "fastapi"
        versions: ["0.136.3"]
